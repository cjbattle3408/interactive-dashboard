<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Debugging Exercise</title>
</head>

<body>
  <h1>Dashboard Status</h1>
  <div id="display"></div>

  <script>
    // Weekly Goal: Calculate the total weekly task goal for a user.

    let userName = "Jane Doe";
    let dailyGoal = 5;

    // FIXED: Use a number instead of a string.
    let bonusTasks = 2;

    // FIXED: Added the missing closing parenthesis.
    console.log("Checking status for: " + userName);

    // FIXED: Corrected the variable name and used five workdays.
    let weeklyGoal = dailyGoal * 5;

    // FIXED: Add bonus tasks to the weekly goal.
    let totalGoal = weeklyGoal + bonusTasks;

    // Display the results using DOM nodes.
    const display = document.getElementById("display");

    const userMessage = document.createElement("p");
    userMessage.textContent = "User: " + userName;

    const totalMessage = document.createElement("p");
    totalMessage.textContent = "Total Weekly Goal: " + totalGoal;

    display.appendChild(userMessage);
    display.appendChild(totalMessage);
  </script>
</body>
</html>
